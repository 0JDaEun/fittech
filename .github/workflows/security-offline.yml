name: Security offline checks
on:
  push:
    branches: [security/config-hardening]
    paths:
      - '**.py'
      - '.github/workflows/security-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -m compileall -q flask tests 
      - name: Run configuration tests
        run: python3 -m unittest discover -s tests -p 'test_db_configuration.py' -v
